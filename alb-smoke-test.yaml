apiVersion: apps/v1
kind: Deployment
metadata:
  name: alb-demo
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alb-demo
  template:
    metadata:
      labels:
        app: alb-demo
    spec:
      containers:
      - name: alb-demo
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: alb-demo-svc
  namespace: default
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: alb-demo
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alb-demo-ingress
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: alb-demo-svc
            port:
              number: 80
