apiVersion: apps/v1
kind: Deployment
metadata:
  name: alb-demo
  labels:
    app: alb-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alb-demo
  template:
    metadata:
      labels:
        app: alb-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: alb-demo
        image: nginx:alpine
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 80
        volumeMounts:
        - name: var-cache
          mountPath: /var/cache/nginx
        - name: var-run
          mountPath: /var/run
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: var-cache
        emptyDir: {}
      - name: var-run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alb-demo-service
spec:
  type: ClusterIP
  selector:
    app: alb-demo
  ports:
    - port: 80
      targetPort: 80
